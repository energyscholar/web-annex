<path d="M190,38 L198,92 L190,100 L182,92 Z M190,162 L198,108 L190,100 L182,108 Z M128,100 L182,92 L190,100 L182,108 Z M252,100 L198,92 L190,100 L198,108 Z" fill="none" stroke="#94a3b8" stroke-width="2"/>
