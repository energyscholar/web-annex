<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Three gradient signs beside one long level line of track: the first sign shows a gentle slope, the next steeper, the last steeper still. The line is the same; the pitch it stands for changes as you go." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="640" height="200" fill="#13203a"/>
<line x1="20" y1="152" x2="620" y2="152" stroke="#fbbf24" stroke-width="5" stroke-dasharray="16 8"/>
<line x1="120" y1="150" x2="120" y2="96" stroke="#94a3b8" stroke-width="5"/><rect x="78" y="62" width="84" height="40" rx="5" fill="#f1f5f9"/><line x1="86.3" y1="86.7" x2="153.7" y2="77.3" stroke="#13203a" stroke-width="6" stroke-linecap="round"/>
<line x1="320" y1="150" x2="320" y2="96" stroke="#94a3b8" stroke-width="5"/><rect x="278" y="62" width="84" height="40" rx="5" fill="#f1f5f9"/><line x1="288.5" y1="94.7" x2="351.5" y2="69.3" stroke="#13203a" stroke-width="6" stroke-linecap="round"/>
<line x1="520" y1="150" x2="520" y2="96" stroke="#94a3b8" stroke-width="5"/><rect x="478" y="62" width="84" height="40" rx="5" fill="#f1f5f9"/><line x1="493.2" y1="102.9" x2="546.8" y2="61.1" stroke="#13203a" stroke-width="6" stroke-linecap="round"/>
<text x="320" y="40" font-size="30" font-weight="600" text-anchor="middle" fill="#f1f5f9">the pitch changes as you go</text>
<text x="320" y="190" font-size="28" font-weight="500" text-anchor="middle" fill="#f1f5f9">one line of track</text>
</svg>
