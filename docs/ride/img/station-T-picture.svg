<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Three doors in a wall. The first two stand open, labelled edge of chaos and criticality. The third, labelled Poised Realm, is still shut: not yet tested." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="640" height="200" fill="#13203a"/>
<rect x="40" y="60" width="130" height="135" fill="#0b1222" stroke="#94a3b8" stroke-width="3"/><path d="M40,60 L170,60 L170,195 L40,195 Z" fill="#fde68a" opacity="0.55"/><path d="M40,60 L78,72 L78,186 L40,195 Z" fill="#7c4a1e" stroke="#f1f5f9" stroke-width="2"/>
<rect x="255" y="60" width="130" height="135" fill="#0b1222" stroke="#94a3b8" stroke-width="3"/><path d="M255,60 L385,60 L385,195 L255,195 Z" fill="#fde68a" opacity="0.55"/><path d="M255,60 L293,72 L293,186 L255,195 Z" fill="#7c4a1e" stroke="#f1f5f9" stroke-width="2"/>
<rect x="470" y="60" width="130" height="135" fill="#0b1222" stroke="#94a3b8" stroke-width="3"/><rect x="474" y="64" width="122" height="131" fill="#7c4a1e" stroke="#f1f5f9" stroke-width="2"/><circle cx="578" cy="130" r="6" fill="#fbbf24"/>
<text x="105" y="40" font-size="28" font-weight="600" text-anchor="middle" fill="#f1f5f9">edge of chaos</text>
<text x="320" y="40" font-size="28" font-weight="600" text-anchor="middle" fill="#f1f5f9">criticality</text>
<text x="535" y="40" font-size="28" font-weight="600" text-anchor="middle" fill="#f1f5f9">Poised Realm</text>
<text x="535" y="140" font-size="28" font-weight="700" text-anchor="middle" fill="#f1f5f9">shut</text>
</svg>
