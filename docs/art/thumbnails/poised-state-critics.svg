<svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="80" rx="6" fill="#1e293b"/>

  <!-- log-log axes -->
  <line x1="24" y1="66" x2="150" y2="66" stroke="#475569" stroke-width="1"/>
  <line x1="24" y1="14" x2="24" y2="66" stroke="#475569" stroke-width="1"/>

  <!-- slope -1 guide -->
  <line x1="28" y1="18" x2="146" y2="62" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="5 3" opacity="0.85"/>

  <!-- driven: straight -->
  <circle cx="34" cy="22" r="2.4" fill="#3b82f6"/>
  <circle cx="50" cy="28" r="2.4" fill="#3b82f6"/>
  <circle cx="66" cy="34" r="2.4" fill="#3b82f6"/>
  <circle cx="82" cy="40" r="2.4" fill="#3b82f6"/>
  <circle cx="98" cy="46" r="2.4" fill="#3b82f6"/>
  <circle cx="114" cy="51" r="2.4" fill="#3b82f6"/>
  <circle cx="130" cy="57" r="2.4" fill="#3b82f6"/>

  <!-- frozen: curved -->
  <path d="M 32 20 C 62 21 86 26 106 40 C 120 50 130 60 142 65" fill="none" stroke="#ef4444" stroke-width="1.8" opacity="0.9"/>

  <!-- unconnected units -->
  <circle cx="176" cy="24" r="4.5" fill="#22c55e" opacity="0.9"/>
  <circle cx="196" cy="24" r="4.5" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <circle cx="216" cy="24" r="4.5" fill="#22c55e" opacity="0.65"/>
  <circle cx="236" cy="24" r="4.5" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <circle cx="176" cy="42" r="4.5" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <circle cx="196" cy="42" r="4.5" fill="#22c55e" opacity="0.8"/>
  <circle cx="216" cy="42" r="4.5" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <circle cx="236" cy="42" r="4.5" fill="#22c55e" opacity="0.5"/>
  <circle cx="176" cy="60" r="4.5" fill="#22c55e" opacity="0.55"/>
  <circle cx="196" cy="60" r="4.5" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <circle cx="216" cy="60" r="4.5" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <circle cx="236" cy="60" r="4.5" fill="#22c55e" opacity="0.75"/>

  <!-- the hidden driver above them -->
  <path d="M 168 13 C 184 8 200 16 216 10 C 228 6 240 12 248 9" fill="none" stroke="#a855f7" stroke-width="1.6" opacity="0.9"/>

  <text x="258" y="72" fill="#475569" font-family="Georgia, serif" font-size="8" text-anchor="end">poised state &#215; its critics</text>
