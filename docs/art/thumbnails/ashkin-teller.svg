<svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="80" rx="6" fill="#1e293b"/>

  <!-- two Ising layers, sigma and tau -->
  <g>
    <rect x="16" y="14" width="40" height="40" rx="3" fill="#28200a" stroke="#f59e0b" stroke-width="1"/>
    <rect x="20" y="18" width="10" height="10" fill="#f59e0b"/><rect x="40" y="18" width="12" height="8" fill="#f59e0b"/>
    <rect x="22" y="34" width="16" height="14" fill="#f59e0b"/><rect x="44" y="40" width="8" height="10" fill="#f59e0b"/>
    <text x="36" y="68" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="Georgia" font-style="italic">&#963;</text>
  </g>
  <g>
    <rect x="70" y="14" width="40" height="40" rx="3" fill="#0c162d" stroke="#3b82f6" stroke-width="1"/>
    <rect x="74" y="20" width="14" height="12" fill="#3b82f6"/><rect x="94" y="16" width="10" height="10" fill="#3b82f6"/>
    <rect x="76" y="38" width="8" height="12" fill="#3b82f6"/><rect x="92" y="34" width="14" height="14" fill="#3b82f6"/>
    <text x="90" y="68" text-anchor="middle" fill="#3b82f6" font-size="9" font-family="Georgia" font-style="italic">&#964;</text>
  </g>
  <text x="63" y="38" text-anchor="middle" fill="#a855f7" font-size="10" font-family="Georgia" font-style="italic">&#215;</text>

  <!-- the unit square with the self-dual line and its critical segment -->
  <rect x="150" y="8" width="64" height="64" fill="#0b1222" stroke="#475569" stroke-width="1"/>
  <path d="M 150 72 Q 182 72 214 8" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2" fill="none"/>
  <line x1="150" y1="72" x2="214" y2="8" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="176.5" y1="61" x2="182" y2="72" stroke="#f59e0b" stroke-width="1"/>
  <line x1="171.3" y1="50.7" x2="176.5" y2="61" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="171.3" cy="50.7" r="2.2" fill="#a855f7"/>
  <circle cx="176.5" cy="61" r="2.2" fill="#f1f5f9"/>

  <!-- what slides, what is pinned -->
  <text x="250" y="30" text-anchor="middle" fill="#a855f7" font-size="8" font-family="Georgia" font-style="italic">&#945;/&#957;: 0 &#8594; 1</text>
  <text x="250" y="46" text-anchor="middle" fill="#22c55e" font-size="8" font-family="Georgia" font-style="italic">&#947;/&#957; = 7/4</text>
  <text x="250" y="62" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="system-ui">a critical line</text>
</svg>
