<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#1e293b"/>
  <!-- Central figure (trainer) -->
  <circle cx="200" cy="70" r="18" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="200" y1="88" x2="200" y2="125" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="175" y1="105" x2="225" y2="105" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- Left trainee -->
  <circle cx="100" cy="130" r="12" fill="none" stroke="#22c55e" stroke-width="2"/>
  <line x1="100" y1="142" x2="100" y2="165" stroke="#22c55e" stroke-width="2"/>
  <line x1="85" y1="152" x2="115" y2="152" stroke="#22c55e" stroke-width="2"/>
  <!-- Right trainee -->
  <circle cx="300" cy="130" r="12" fill="none" stroke="#22c55e" stroke-width="2"/>
  <line x1="300" y1="142" x2="300" y2="165" stroke="#22c55e" stroke-width="2"/>
  <line x1="285" y1="152" x2="315" y2="152" stroke="#22c55e" stroke-width="2"/>
  <!-- Connection lines from trainer to trainees -->
  <line x1="185" y1="115" x2="112" y2="130" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="215" y1="115" x2="288" y2="130" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Far-left trainee of trainee -->
  <circle cx="55" cy="175" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="160" x2="63" y2="172" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Center-left trainee of trainee -->
  <circle cx="145" cy="175" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="110" y1="160" x2="137" y2="172" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Center-right trainee of trainee -->
  <circle cx="255" cy="175" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="290" y1="160" x2="263" y2="172" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Far-right trainee of trainee -->
  <circle cx="345" cy="175" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="310" y1="160" x2="337" y2="172" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Train the Trainer</text>
</svg>
