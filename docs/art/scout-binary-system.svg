<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="1120" height="630">
  <defs>
    <!-- Star glow filters -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlowSmall" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="planetShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="shadow"/>
      <feOffset dx="2" dy="1"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="engineGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <!-- Star gradients -->
    <radialGradient id="starPrimary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef0"/>
      <stop offset="30%" stop-color="#fff4c0"/>
      <stop offset="60%" stop-color="#ffd866"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starSecondary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ff"/>
      <stop offset="30%" stop-color="#e8d0ff"/>
      <stop offset="60%" stop-color="#c490ff"/>
      <stop offset="100%" stop-color="#7040c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd866" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ff8c00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starCoronaB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c490ff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#7040c0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4020a0" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet gradient -->
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a7a9b"/>
      <stop offset="40%" stop-color="#2d5a7b"/>
      <stop offset="70%" stop-color="#1a3d5c"/>
      <stop offset="100%" stop-color="#0d1f2d"/>
    </radialGradient>
    <radialGradient id="planetAtmo" cx="30%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#88ccee" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#4488aa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#225577" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon gradient -->
    <radialGradient id="moonGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#b0a898"/>
      <stop offset="50%" stop-color="#887868"/>
      <stop offset="100%" stop-color="#504038"/>
    </radialGradient>

    <!-- Background star field -->
    <pattern id="stars" x="0" y="0" width="1120" height="630" patternUnits="userSpaceOnUse">
      <!-- Dense field of dim stars -->
      <circle cx="45" cy="23" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="112" cy="67" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="178" cy="12" r="0.8" fill="#ffe8c0" opacity="0.6"/>
      <circle cx="234" cy="89" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="301" cy="34" r="0.7" fill="#c8d8ff" opacity="0.5"/>
      <circle cx="367" cy="112" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="423" cy="56" r="0.9" fill="#ffe0a0" opacity="0.7"/>
      <circle cx="489" cy="145" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="556" cy="28" r="0.6" fill="#d0e0ff" opacity="0.5"/>
      <circle cx="612" cy="98" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="678" cy="167" r="0.7" fill="#ffffff" opacity="0.5"/>
      <circle cx="745" cy="45" r="0.5" fill="#ffe8c0" opacity="0.4"/>
      <circle cx="811" cy="123" r="0.8" fill="#ffffff" opacity="0.6"/>
      <circle cx="878" cy="78" r="0.4" fill="#c8d8ff" opacity="0.3"/>
      <circle cx="934" cy="156" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="1001" cy="34" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="1067" cy="189" r="0.7" fill="#ffe0a0" opacity="0.5"/>
      <circle cx="67" cy="201" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="134" cy="234" r="0.8" fill="#c8d8ff" opacity="0.6"/>
      <circle cx="201" cy="189" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="267" cy="267" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="334" cy="212" r="0.5" fill="#ffe8c0" opacity="0.4"/>
      <circle cx="400" cy="289" r="0.7" fill="#ffffff" opacity="0.5"/>
      <circle cx="467" cy="245" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="534" cy="312" r="0.9" fill="#d0e0ff" opacity="0.7"/>
      <circle cx="600" cy="201" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="667" cy="278" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="734" cy="334" r="0.4" fill="#ffe0a0" opacity="0.3"/>
      <circle cx="800" cy="223" r="0.7" fill="#ffffff" opacity="0.5"/>
      <circle cx="867" cy="301" r="0.5" fill="#c8d8ff" opacity="0.4"/>
      <circle cx="934" cy="256" r="0.8" fill="#ffffff" opacity="0.6"/>
      <circle cx="1000" cy="345" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="1067" cy="289" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="56" cy="378" r="0.7" fill="#ffe8c0" opacity="0.5"/>
      <circle cx="123" cy="412" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="189" cy="356" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="256" cy="445" r="0.8" fill="#d0e0ff" opacity="0.6"/>
      <circle cx="323" cy="389" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="389" cy="467" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="456" cy="401" r="0.5" fill="#ffe0a0" opacity="0.4"/>
      <circle cx="523" cy="478" r="0.7" fill="#ffffff" opacity="0.5"/>
      <circle cx="589" cy="423" r="0.4" fill="#c8d8ff" opacity="0.3"/>
      <circle cx="656" cy="489" r="0.9" fill="#ffffff" opacity="0.7"/>
      <circle cx="723" cy="445" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="789" cy="512" r="0.6" fill="#ffe8c0" opacity="0.5"/>
      <circle cx="856" cy="456" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="923" cy="523" r="0.7" fill="#ffffff" opacity="0.5"/>
      <circle cx="989" cy="478" r="0.5" fill="#d0e0ff" opacity="0.4"/>
      <circle cx="1056" cy="534" r="0.8" fill="#ffffff" opacity="0.6"/>
      <circle cx="78" cy="534" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="145" cy="567" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="212" cy="589" r="0.5" fill="#ffe0a0" opacity="0.4"/>
      <circle cx="278" cy="534" r="0.7" fill="#ffffff" opacity="0.5"/>
      <circle cx="345" cy="601" r="0.4" fill="#c8d8ff" opacity="0.3"/>
      <circle cx="412" cy="556" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="478" cy="612" r="0.8" fill="#ffe8c0" opacity="0.6"/>
      <circle cx="545" cy="567" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="612" cy="589" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="678" cy="601" r="0.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="745" cy="567" r="0.7" fill="#d0e0ff" opacity="0.5"/>
      <circle cx="812" cy="612" r="0.4" fill="#ffffff" opacity="0.3"/>
      <circle cx="878" cy="578" r="0.9" fill="#ffffff" opacity="0.7"/>
      <circle cx="945" cy="601" r="0.5" fill="#ffe0a0" opacity="0.4"/>
      <circle cx="1012" cy="567" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="1078" cy="612" r="0.4" fill="#ffffff" opacity="0.3"/>
      <!-- Twinkling stars -->
      <circle cx="890" cy="45" r="1.0" fill="#ffffff" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="490" r="1.1" fill="#ffe8c0" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="180" r="0.9" fill="#c8d8ff" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="5.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1050" cy="390" r="1.0" fill="#ffffff" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="580" r="0.8" fill="#ffe0a0" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="6.1s" repeatCount="indefinite"/>
      </circle>
    </pattern>

    <!-- Scout ship shape -->
    <g id="scoutShip">
      <!-- Main hull - elongated diamond -->
      <polygon points="0,-18 5,-6 4,10 2,16 -2,16 -4,10 -5,-6" fill="#3a4555" stroke="#5a6a7a" stroke-width="0.5"/>
      <!-- Bridge canopy -->
      <ellipse cx="0" cy="-10" rx="2.5" ry="3.5" fill="#1a2a3a" stroke="#4a6a8a" stroke-width="0.4"/>
      <ellipse cx="0" cy="-11" rx="1.5" ry="2" fill="#2a4a6a" opacity="0.6"/>
      <!-- Port wing -->
      <polygon points="-4,0 -14,6 -12,10 -4,8" fill="#2d3845" stroke="#4a5a6a" stroke-width="0.4"/>
      <!-- Starboard wing -->
      <polygon points="4,0 14,6 12,10 4,8" fill="#2d3845" stroke="#4a5a6a" stroke-width="0.4"/>
      <!-- Engine nacelles -->
      <rect x="-6" y="12" width="3" height="5" rx="1" fill="#2a3545" stroke="#4a5a6a" stroke-width="0.3"/>
      <rect x="3" y="12" width="3" height="5" rx="1" fill="#2a3545" stroke="#4a5a6a" stroke-width="0.3"/>
      <!-- Engine glow -->
      <ellipse cx="-4.5" cy="17.5" rx="1.8" ry="1" fill="#66ccff" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="4.5" cy="17.5" rx="1.8" ry="1" fill="#66ccff" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Running lights -->
      <circle cx="-14" cy="6" r="0.6" fill="#ff3333">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="14" cy="6" r="0.6" fill="#33ff33">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </defs>

  <!-- Deep space background -->
  <rect width="1120" height="630" fill="#030810"/>

  <!-- Very subtle nebula wash -->
  <ellipse cx="200" cy="400" rx="300" ry="200" fill="#1a0a2a" opacity="0.15"/>
  <ellipse cx="900" cy="200" rx="250" ry="180" fill="#0a1a2a" opacity="0.12"/>

  <!-- Star field -->
  <rect width="1120" height="630" fill="url(#stars)"/>

  <!-- Binary star system — upper left quadrant -->
  <!-- Primary star (G-type, yellow-white) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 3,2; 0,0; -3,-2; 0,0" dur="40s" repeatCount="indefinite"/>
    <!-- Corona -->
    <circle cx="165" cy="195" r="80" fill="url(#starCorona)"/>
    <!-- Star body -->
    <circle cx="165" cy="195" r="32" fill="url(#starPrimary)" filter="url(#starGlow)">
      <animate attributeName="r" values="32;33;32;31.5;32" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Secondary star (K-type, blue-violet, smaller, orbiting) -->
  <g>
    <!-- Orbital motion around primary -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 12,-8; 20,-4; 12,6; 0,0" dur="40s" repeatCount="indefinite"/>
    <!-- Corona -->
    <circle cx="230" cy="165" r="50" fill="url(#starCoronaB)"/>
    <!-- Star body -->
    <circle cx="230" cy="165" r="20" fill="url(#starSecondary)" filter="url(#starGlowSmall)">
      <animate attributeName="r" values="20;20.8;20;19.5;20" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Light spill from binary onto scene -->
  <ellipse cx="200" cy="185" r="400" ry="350" fill="#ffd866" opacity="0.012"/>
  <ellipse cx="230" cy="170" r="300" ry="280" fill="#c490ff" opacity="0.008"/>

  <!-- Planet — right side, lower -->
  <g transform="translate(780, 380)">
    <!-- Atmosphere halo -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="#4a8aaa" stroke-width="2" opacity="0.12"/>
    <circle cx="0" cy="0" r="80" fill="url(#planetAtmo)"/>

    <!-- Planet body -->
    <circle cx="0" cy="0" r="72" fill="url(#planetGrad)"/>

    <!-- Surface features - continental masses -->
    <path d="M -30,-50 Q -15,-55 0,-45 Q 10,-50 15,-40 Q 20,-30 10,-25 Q -5,-20 -20,-30 Q -35,-40 -30,-50Z"
          fill="#2a6a4a" opacity="0.3"/>
    <path d="M 20,5 Q 35,-5 45,10 Q 50,25 40,35 Q 25,40 15,30 Q 10,15 20,5Z"
          fill="#2a6a4a" opacity="0.25"/>
    <path d="M -45,15 Q -35,10 -25,20 Q -20,35 -30,40 Q -45,35 -50,25 Q -50,18 -45,15Z"
          fill="#2a6a4a" opacity="0.2"/>
    <path d="M -10,45 Q 5,40 15,50 Q 10,60 -5,58 Q -15,52 -10,45Z"
          fill="#2a6a4a" opacity="0.2"/>

    <!-- Cloud bands -->
    <path d="M -60,-25 Q -30,-30 0,-22 Q 30,-28 55,-20" fill="none" stroke="#88bbdd" stroke-width="3" opacity="0.1"/>
    <path d="M -50,15 Q -20,10 10,18 Q 40,12 60,20" fill="none" stroke="#88bbdd" stroke-width="2" opacity="0.08"/>

    <!-- Polar ice -->
    <ellipse cx="0" cy="-65" rx="25" ry="8" fill="#aaccdd" opacity="0.15"/>
    <ellipse cx="0" cy="65" rx="20" ry="6" fill="#aaccdd" opacity="0.1"/>

    <!-- Terminator shadow (lit from upper-left binary) -->
    <circle cx="0" cy="0" r="72" fill="url(#planetGrad)"/>
    <clipPath id="planetClip">
      <circle cx="0" cy="0" r="72"/>
    </clipPath>
    <rect x="15" y="-75" width="80" height="150" fill="#000000" opacity="0.5" clip-path="url(#planetClip)">
      <animate attributeName="x" values="15;18;15;12;15" dur="40s" repeatCount="indefinite"/>
    </rect>

    <!-- Specular highlight from primary star -->
    <ellipse cx="-25" cy="-25" rx="18" ry="22" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- Moon orbit path (subtle) -->
  <ellipse cx="780" cy="380" rx="135" ry="45" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"
    transform="rotate(-15, 780, 380)"/>

  <!-- Moon — orbiting the planet -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 780 380; 360 780 380" dur="60s" repeatCount="indefinite"/>
    <g transform="translate(135, 0) rotate(15)">
      <!-- Counteract parent rotation so moon doesn't spin -->
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 0; -360 0 0" dur="60s" repeatCount="indefinite" additive="sum"/>
      <g transform="translate(780,380)">
        <!-- Moon body -->
        <circle cx="0" cy="0" r="14" fill="url(#moonGrad)"/>
        <!-- Crater details -->
        <circle cx="-4" cy="-5" r="3" fill="#706058" opacity="0.3"/>
        <circle cx="5" cy="2" r="2" fill="#605048" opacity="0.25"/>
        <circle cx="-2" cy="7" r="1.5" fill="#706058" opacity="0.2"/>
        <!-- Shadow -->
        <clipPath id="moonClip">
          <circle cx="0" cy="0" r="14"/>
        </clipPath>
        <rect x="4" y="-16" width="14" height="32" fill="#000000" opacity="0.45" clip-path="url(#moonClip)"/>
      </g>
    </g>
  </g>

  <!-- Scout ship — geostationary orbit, well back from planet -->
  <g transform="translate(600, 290) rotate(-30) scale(1.8)">
    <!-- Engine exhaust trail (faint, pulsing) -->
    <ellipse cx="0" cy="22" rx="1" ry="6" fill="#66ccff" opacity="0.15" filter="url(#engineGlow)">
      <animate attributeName="ry" values="6;10;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.05;0.15" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <use href="#scoutShip"/>
    <!-- Sensor dish pulse -->
    <circle cx="0" cy="-18" r="3" fill="none" stroke="#66aaff" stroke-width="0.3" opacity="0">
      <animate attributeName="r" values="3;25;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle light rays from binary toward planet -->
  <line x1="200" y1="195" x2="710" y2="355" stroke="#ffd866" stroke-width="0.5" opacity="0.03"/>
  <line x1="200" y1="195" x2="720" y2="365" stroke="#ffd866" stroke-width="0.3" opacity="0.02"/>
  <line x1="230" y1="165" x2="715" y2="350" stroke="#c490ff" stroke-width="0.3" opacity="0.02"/>
</svg>
