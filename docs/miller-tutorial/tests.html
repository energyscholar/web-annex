<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miller Engine -- Test Suite</title>
<style>
  :root {
    --bg: #0a0e14;
    --surface: #111820;
    --card: #161d28;
    --border: #1e2a3a;
    --text: #c8d0dc;
    --text-dim: #6a7a8c;
    --accent: #4fc3f7;
    --green: #81c784;
    --red: #ef5350;
    --orange: #ffb74d;
    --mono: 'Courier New', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    line-height: 1.6;
  }
  h1 {
    color: var(--accent);
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
    letter-spacing: 0.06em;
  }
  .summary {
    margin-bottom: 2rem;
    font-size: 0.9rem;
    padding: 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .summary.all-pass { border-left: 3px solid var(--green); }
  .summary.has-fail { border-left: 3px solid var(--red); }
  .section-title {
    color: var(--accent);
    font-size: 1rem;
    margin: 1.5rem 0 0.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.3rem;
    letter-spacing: 0.05em;
  }
  .test {
    padding: 0.3rem 0.6rem;
    font-size: 0.82rem;
    border-left: 3px solid transparent;
    margin-bottom: 2px;
  }
  .test.pass { border-left-color: var(--green); color: var(--green); }
  .test.fail { border-left-color: var(--red); color: var(--red); background: rgba(239,83,80,0.05); }
  .test .detail { color: var(--text-dim); font-size: 0.78rem; margin-left: 1rem; }
  .test .num { color: var(--text-dim); display: inline-block; width: 2.5em; }
</style>
</head>
<body>

<h1>Miller Engine -- Test Suite</h1>
<div id="summary" class="summary">Running...</div>
<div id="results"></div>

<script src="miller-engine.js"></script>
<script>
(function() {
  'use strict';

  var Automaton = Miller.Automaton;
  var Game = Miller.Game;
  var GA = Miller.GA;
  var Experiment = Miller.Experiment;
  var RNG = Miller.RNG;

  var results = [];
  var currentSection = '';

  function section(name) {
    currentSection = name;
  }

  function assert(num, name, condition, detail) {
    results.push({ num: num, section: currentSection, name: name, pass: !!condition, detail: detail || '' });
  }

  function assertEq(num, name, actual, expected) {
    var pass = actual === expected;
    assert(num, name, pass, pass ? '' : 'expected ' + expected + ', got ' + actual);
  }

  function assertClose(num, name, actual, expected, tolerance) {
    var pass = Math.abs(actual - expected) <= tolerance;
    assert(num, name, pass, pass ? '' : 'expected ~' + expected + ' +/- ' + tolerance + ', got ' + actual);
  }

  // ===== P1.1: Automaton Module =====
  section('P1.1: Automaton');

  // Test 1: allC structure
  var allC = Automaton.createNamed('allC');
  assertEq(1, 'allC: 1 state', allC.states, 1);
  assert(1, 'allC: action=0', allC.actions[0] === 0, 'action=' + allC.actions[0]);
  assert(1, 'allC: transC=0', allC.transC[0] === 0);
  assert(1, 'allC: transD=0', allC.transD[0] === 0);

  // Test 2: allD structure
  var allD = Automaton.createNamed('allD');
  assertEq(2, 'allD: 1 state', allD.states, 1);
  assert(2, 'allD: action=1', allD.actions[0] === 1, 'action=' + allD.actions[0]);
  assert(2, 'allD: transC=0', allD.transC[0] === 0);
  assert(2, 'allD: transD=0', allD.transD[0] === 0);

  // Test 3: TFT structure
  var tft = Automaton.createNamed('tft');
  assertEq(3, 'tft: 2 states', tft.states, 2);
  assert(3, 'tft state0: action=0, transC=0, transD=1',
    tft.actions[0] === 0 && tft.transC[0] === 0 && tft.transD[0] === 1);
  assert(3, 'tft state1: action=1, transC=0, transD=1',
    tft.actions[1] === 1 && tft.transC[1] === 0 && tft.transD[1] === 1);

  // Test 4: Grim Trigger structure
  var grim = Automaton.createNamed('grimTrigger');
  assertEq(4, 'grimTrigger: 2 states', grim.states, 2);
  assert(4, 'grim state0: C, transC=0, transD=1',
    grim.actions[0] === 0 && grim.transC[0] === 0 && grim.transD[0] === 1);
  assert(4, 'grim state1: D, transC=1, transD=1 (absorbing)',
    grim.actions[1] === 1 && grim.transC[1] === 1 && grim.transD[1] === 1);

  // Tests 5-8: TFT stepping
  var tftR = Automaton.reset(tft);
  var step5 = Automaton.step(tftR, 0); // from state 0, opponent C
  assert(5, 'tft step(0,C): action=0, next=0',
    step5.action === 0 && step5.nextState === 0,
    'action=' + step5.action + ' next=' + step5.nextState);

  var step6 = Automaton.step(tftR, 1); // from state 0, opponent D
  assert(6, 'tft step(0,D): action=0, next=1',
    step6.action === 0 && step6.nextState === 1,
    'action=' + step6.action + ' next=' + step6.nextState);

  // Move to state 1
  var tftS1 = Automaton.reset(tft);
  tftS1.currentState = 1;
  var step7 = Automaton.step(tftS1, 0); // from state 1, opponent C
  assert(7, 'tft step(1,C): action=1, next=0',
    step7.action === 1 && step7.nextState === 0,
    'action=' + step7.action + ' next=' + step7.nextState);

  var step8 = Automaton.step(tftS1, 1); // from state 1, opponent D
  assert(8, 'tft step(1,D): action=1, next=1',
    step8.action === 1 && step8.nextState === 1,
    'action=' + step8.action + ' next=' + step8.nextState);

  // Test 9: TFT stats
  var tftStats = Automaton.stats(tft);
  assertEq(9, 'tft stats: accessibleStates=2', tftStats.accessibleStates, 2);
  assertClose(9, 'tft stats: cReciprocity=1.0', tftStats.cReciprocity, 1.0, 0.001);
  assertClose(9, 'tft stats: dReciprocity=1.0', tftStats.dReciprocity, 1.0, 0.001);
  assertEq(9, 'tft stats: terminalStates=0', tftStats.terminalStates, 0);

  // Test 10: Grim Trigger stats
  var grimStats = Automaton.stats(grim);
  assertEq(10, 'grim stats: accessibleStates=2', grimStats.accessibleStates, 2);
  assertClose(10, 'grim stats: cReciprocity=0.5', grimStats.cReciprocity, 0.5, 0.001);
  assertClose(10, 'grim stats: dReciprocity=1.0', grimStats.dReciprocity, 1.0, 0.001);
  assertEq(10, 'grim stats: terminalStates=1', grimStats.terminalStates, 1);

  // Test 11: allC stats
  var allCStats = Automaton.stats(allC);
  assertEq(11, 'allC stats: accessibleStates=1', allCStats.accessibleStates, 1);
  assertClose(11, 'allC stats: cReciprocity=1.0', allCStats.cReciprocity, 1.0, 0.001);
  assertClose(11, 'allC stats: dReciprocity=0', allCStats.dReciprocity, 0, 0.001);
  assertEq(11, 'allC stats: terminalStates=1', allCStats.terminalStates, 1);

  // Test 12: random create validity
  var rng12 = RNG.create(42);
  var rand4 = Automaton.create(4, { rng: rng12 });
  assert(12, 'create(4): valid states', rand4.states === 4);
  var valid12 = true;
  for (var i = 0; i < 4; i++) {
    if (rand4.actions[i] > 1) valid12 = false;
    if (rand4.transC[i] > 3) valid12 = false;
    if (rand4.transD[i] > 3) valid12 = false;
  }
  if (rand4.startState > 3) valid12 = false;
  assert(12, 'create(4): all values in valid range', valid12);

  // Test 13: identify
  assertEq(13, 'identify(tft) = tft', Automaton.identify(tft), 'tft');
  assertEq(13, 'identify(allD) = allD', Automaton.identify(allD), 'allD');
  assertEq(13, 'identify(allC) = allC', Automaton.identify(allC), 'allC');
  assertEq(13, 'identify(grim) = grimTrigger', Automaton.identify(grim), 'grimTrigger');
  assertEq(13, 'identify(random) = null', Automaton.identify(rand4), null);

  // Test 14: clone independence
  var orig14 = Automaton.createNamed('tft');
  var clone14 = Automaton.clone(orig14);
  clone14.actions[0] = 1;
  clone14.transC[0] = 1;
  assert(14, 'clone: mutating clone does not affect original',
    orig14.actions[0] === 0 && orig14.transC[0] === 0,
    'orig action=' + orig14.actions[0] + ' transC=' + orig14.transC[0]);

  // ===== P1.2: Game Module =====
  section('P1.2: Game');

  var pd = Game.defaultPD();

  // Test 15: AllC vs AllD
  var r15 = Game.play(allC, allD, 10, pd);
  assertEq(15, 'AllC vs AllD: scoreA=0', r15.scoreA, 0);
  assertEq(15, 'AllC vs AllD: scoreB=50', r15.scoreB, 50);

  // Test 16: AllC vs AllC
  var r16 = Game.play(allC, allC, 10, pd);
  assertEq(16, 'AllC vs AllC: scoreA=30', r16.scoreA, 30);
  assertEq(16, 'AllC vs AllC: scoreB=30', r16.scoreB, 30);

  // Test 17: AllD vs AllD
  var r17 = Game.play(allD, allD, 10, pd);
  assertEq(17, 'AllD vs AllD: scoreA=10', r17.scoreA, 10);
  assertEq(17, 'AllD vs AllD: scoreB=10', r17.scoreB, 10);

  // Test 18: TFT vs AllD
  // Round 1: TFT=C(0), AllD=D(1) -> TFT gets S=0, AllD gets T=5. TFT transitions to state 1.
  // Rounds 2-10: TFT=D(1), AllD=D(1) -> both get P=1. TFT stays at state 1.
  // TFT total: 0 + 9*1 = 9. AllD total: 5 + 9*1 = 14.
  var r18 = Game.play(tft, allD, 10, pd);
  assertEq(18, 'TFT vs AllD: scoreA=9', r18.scoreA, 9);
  assertEq(18, 'TFT vs AllD: scoreB=14', r18.scoreB, 14);

  // Test 19: TFT vs TFT
  var r19 = Game.play(tft, tft, 10, pd);
  assertEq(19, 'TFT vs TFT: scoreA=30', r19.scoreA, 30);
  assertEq(19, 'TFT vs TFT: scoreB=30', r19.scoreB, 30);

  // Test 20: TFT vs AllC
  var r20 = Game.play(tft, allC, 10, pd);
  assertEq(20, 'TFT vs AllC: scoreA=30', r20.scoreA, 30);
  assertEq(20, 'TFT vs AllC: scoreB=30', r20.scoreB, 30);

  // Test 21: GrimTrigger behavior
  // Create a custom automaton that plays C,D,C,C,C
  // We'll use a 3-state automaton: state0=C(transC=0,transD=0), state1=D(transC=2,transD=2), state2=C(transC=2,transD=2)
  // Plays: C, D, C, C, C
  // Wait -- that doesn't work because Moore machines respond to opponent's moves.
  // Let's just verify grim trigger vs allD, which is clear:
  // Round 1: Grim=C, AllD=D -> Grim gets S=0, AllD gets T=5. Grim->state1.
  // Round 2-5: Grim=D, AllD=D -> both get P=1. Grim stays state1.
  // Grim total: 0 + 4*1 = 4. AllD total: 5 + 4*1 = 9.
  var r21 = Game.play(grim, allD, 5, pd);
  assertEq(21, 'Grim vs AllD (5 rounds): Grim=4', r21.scoreA, 4);
  assertEq(21, 'Grim vs AllD (5 rounds): AllD=9', r21.scoreB, 9);
  // Verify trigger fired: after round 1, grim should defect forever
  assert(21, 'Grim trigger fires: round 1 C, round 2+ D',
    r21.history[0].moveA === 0 && r21.history[1].moveA === 1 &&
    r21.history[2].moveA === 1 && r21.history[3].moveA === 1 && r21.history[4].moveA === 1);

  // Test 22: History length and values
  var r22 = Game.play(tft, allD, 5, pd);
  assertEq(22, 'history length = rounds', r22.history.length, 5);
  assert(22, 'history moves are 0 or 1',
    r22.history.every(function(h) { return (h.moveA === 0 || h.moveA === 1) && (h.moveB === 0 || h.moveB === 1); }));

  // Test 23: playNoHistory matches play
  var r23a = Game.play(tft, allD, 10, pd);
  var r23b = Game.playNoHistory(tft, allD, 10, pd);
  assertEq(23, 'playNoHistory same scoreA', r23b.scoreA, r23a.scoreA);
  assertEq(23, 'playNoHistory same scoreB', r23b.scoreB, r23a.scoreB);

  // Test 24: zero rounds
  var r24 = Game.play(tft, allD, 0, pd);
  assertEq(24, 'zero rounds: scoreA=0', r24.scoreA, 0);
  assertEq(24, 'zero rounds: scoreB=0', r24.scoreB, 0);

  // ===== P1.3: GA Module =====
  section('P1.3: GA');

  // Test 25: createPopulation
  var rng25 = RNG.create(99);
  var pop25 = GA.createPopulation(30, 16, rng25);
  assertEq(25, 'createPopulation: size=30', pop25.size, 30);
  assertEq(25, 'createPopulation: 30 agents', pop25.agents.length, 30);
  var valid25 = pop25.agents.every(function(a) {
    if (a.states !== 16) return false;
    for (var i = 0; i < 16; i++) {
      if (a.actions[i] > 1 || a.transC[i] > 15 || a.transD[i] > 15) return false;
    }
    return a.startState >= 0 && a.startState <= 15;
  });
  assert(25, 'createPopulation: all valid values', valid25);

  // Test 26: tournament fitness ordering with known population
  // AllC=60, AllD=74, TFT=69 (computed in plan)
  var popKnown = {
    agents: [
      Automaton.createNamed('allD'),
      Automaton.createNamed('allC'),
      Automaton.createNamed('tft')
    ],
    fitness: new Float64Array(3),
    size: 3
  };
  var fit26 = GA.tournament(popKnown, 10, pd);
  // AllD(index 0)=74, AllC(index 1)=60, TFT(index 2)=69
  assertEq(26, 'tournament: AllD fitness=74', fit26[0], 74);
  assertEq(26, 'tournament: AllC fitness=60', fit26[1], 60);
  assertEq(26, 'tournament: TFT fitness=69', fit26[2], 69);
  assert(26, 'tournament order: AllD > TFT > AllC', fit26[0] > fit26[2] && fit26[2] > fit26[1]);

  // Test 27: normalizeScores
  var norm27 = GA.normalizeScores(new Float64Array([74, 69, 60]), 2);
  assert(27, 'normalizeScores: no negative values',
    norm27[0] >= 0 && norm27[1] >= 0 && norm27[2] >= 0);
  var sum27 = norm27[0] + norm27[1] + norm27[2];
  assertClose(27, 'normalizeScores: probabilities sum to 1', sum27, 1.0, 0.001);
  assert(27, 'normalizeScores: higher fitness -> higher probability',
    norm27[0] > norm27[1],
    'p(AllD)=' + norm27[0].toFixed(4) + ' p(AllC)=' + norm27[1].toFixed(4));

  // Test 28: selectParent returns valid index
  var rng28 = RNG.create(77);
  var pop28 = { agents: popKnown.agents, size: 3 };
  var parent28 = GA.selectParent(pop28, norm27, rng28);
  assert(28, 'selectParent: returns valid index', parent28 >= 0 && parent28 < 3, 'got ' + parent28);
  assert(28, 'selectParent: selected agent has non-zero fitness', norm27[parent28] > 0);

  // Test 29: circularCrossover
  var rng29 = RNG.create(55);
  var pA29 = Automaton.createNamed('tft');
  var pB29 = Automaton.createNamed('grimTrigger');
  var children29 = GA.circularCrossover(pA29, pB29, rng29);
  assert(29, 'crossover: produces 2 children', children29.length === 2);
  assert(29, 'crossover: children have same state count', children29[0].states === 2 && children29[1].states === 2);
  // Verify children's genes come from parents (no invented values)
  var allGenesValid = true;
  for (var i = 0; i < 2; i++) {
    var c = children29[i];
    if (c.startState > 1) allGenesValid = false;
    for (var s = 0; s < 2; s++) {
      if (c.actions[s] > 1) allGenesValid = false;
      if (c.transC[s] > 1) allGenesValid = false;
      if (c.transD[s] > 1) allGenesValid = false;
    }
  }
  assert(29, 'crossover: children genes from parents (valid range)', allGenesValid);

  // Test 30: mutate with rate=1.0
  var rng30 = RNG.create(33);
  var orig30 = Automaton.createNamed('tft');
  var mut30 = GA.mutate(orig30, 1.0, rng30);
  assert(30, 'mutate(rate=1.0): all transitions valid',
    mut30.startState >= 0 && mut30.startState < 2);
  var validMut30 = true;
  for (var i = 0; i < 2; i++) {
    if (mut30.actions[i] > 1) validMut30 = false;
    if (mut30.transC[i] > 1) validMut30 = false;
    if (mut30.transD[i] > 1) validMut30 = false;
  }
  assert(30, 'mutate(rate=1.0): all values in valid range', validMut30);

  // Test 31: mutate with rate=0.0
  var rng31 = RNG.create(44);
  var orig31 = Automaton.createNamed('tft');
  var mut31 = GA.mutate(orig31, 0.0, rng31);
  assert(31, 'mutate(rate=0.0): automaton unchanged',
    Automaton.equals(mut31, orig31),
    'actions match: ' + (mut31.actions[0] === orig31.actions[0] && mut31.actions[1] === orig31.actions[1]));

  // Test 32: evolve preserves population size + elites
  var rng32 = RNG.create(11);
  var pop32 = GA.createPopulation(30, 2, rng32);
  var fit32 = GA.tournament(pop32, 10, pd);
  var evolved32 = GA.evolve(pop32, fit32, { rng: rng32, eliteCount: 20, mutationRate: 0.005 });
  assertEq(32, 'evolve: population size preserved', evolved32.size, 30);
  assertEq(32, 'evolve: agents count preserved', evolved32.agents.length, 30);

  // Check that top elite agent is present in new population
  var indices32 = [];
  for (var i = 0; i < 30; i++) indices32.push(i);
  indices32.sort(function(a, b) { return fit32[b] - fit32[a]; });
  var topAgent32 = pop32.agents[indices32[0]];
  var topFound32 = evolved32.agents.some(function(a) { return Automaton.equals(a, topAgent32); });
  assert(32, 'evolve: top elite present in new population', topFound32);

  // ===== P1.4: Experiment Runner =====
  section('P1.4: Experiment');

  // Test 33: run produces correct number of stats
  var stats33 = Experiment.run({
    populationSize: 10, states: 2, rounds: 10, generations: 5, seed: 42, singlePopulation: true
  });
  assertEq(33, 'run(5 gens): produces 5 stats', stats33.length, 5);

  // Test 34: each stat has required fields
  var valid34 = stats33.every(function(s) {
    return typeof s.generation === 'number' &&
           typeof s.cooperationRate === 'number' &&
           typeof s.avgPayoff === 'number' &&
           typeof s.maxPayoff === 'number';
  });
  assert(34, 'each stat has generation, cooperationRate, avgPayoff, maxPayoff', valid34);
  assert(34, 'cooperationRate in [0,1]',
    stats33.every(function(s) { return s.cooperationRate >= 0 && s.cooperationRate <= 1; }));

  // Test 35: AllD population has low cooperation
  // Create a population of AllD agents manually, then run with very low mutation
  // Actually, use the run with states=1 which should produce ~0 or ~1 cooperation
  // (1-state automata can only be AllC or AllD; AllD dominates)
  var stats35 = Experiment.run({
    populationSize: 10, states: 1, rounds: 10, generations: 5, seed: 42, mutationRate: 0.001, singlePopulation: true
  });
  // With 1-state automata, AllD dominates, so final cooperation should be low
  // But random initial population has ~50% AllC, so first gen may have some cooperation.
  // By gen 5, defectors should dominate.
  var lastCoopRate35 = stats35[stats35.length - 1].cooperationRate;
  assert(35, 'states=1: cooperation tends low (AllD dominates)',
    lastCoopRate35 < 0.7,
    'final cooperationRate=' + lastCoopRate35.toFixed(3));

  // Test 36: cooperation rate is non-crazy (no wild single-step jumps)
  var crazy36 = false;
  for (var i = 1; i < stats33.length; i++) {
    var jump = Math.abs(stats33[i].cooperationRate - stats33[i-1].cooperationRate);
    // A jump of > 0.8 in one step would be suspicious for a small-pop simulation
    // but not impossible. We use a generous threshold.
    if (jump > 0.95) crazy36 = true;
  }
  assert(36, 'cooperation rate: no extreme single-step jumps (>0.95)', !crazy36);

  // Test 37: deterministic with same seed
  var stats37a = Experiment.run({
    populationSize: 10, states: 2, rounds: 10, generations: 5, seed: 12345, singlePopulation: true
  });
  var stats37b = Experiment.run({
    populationSize: 10, states: 2, rounds: 10, generations: 5, seed: 12345, singlePopulation: true
  });
  var match37 = true;
  for (var i = 0; i < 5; i++) {
    if (Math.abs(stats37a[i].cooperationRate - stats37b[i].cooperationRate) > 1e-10) match37 = false;
    if (Math.abs(stats37a[i].avgPayoff - stats37b[i].avgPayoff) > 1e-10) match37 = false;
  }
  assert(37, 'same seed -> same results (deterministic)', match37);

  // Test 38: population size preserved across generations
  // This is implicitly tested by Experiment.run completing without error,
  // but let's verify via evolve
  assert(38, 'population size consistent', true); // validated via test 32 + test 33

  // ===== P1.5: Seeded RNG =====
  section('P1.5: RNG');

  // Test 39: same seed same sequence
  var rng39a = RNG.create(42);
  var rng39b = RNG.create(42);
  var match39 = true;
  for (var i = 0; i < 100; i++) {
    if (rng39a.random() !== rng39b.random()) { match39 = false; break; }
  }
  assert(39, 'same seed -> same 100 values', match39);

  // Test 40: different seeds different sequences
  var rng40a = RNG.create(42);
  var rng40b = RNG.create(999);
  var differ40 = false;
  for (var i = 0; i < 10; i++) {
    if (rng40a.random() !== rng40b.random()) { differ40 = true; break; }
  }
  assert(40, 'different seeds -> different sequences', differ40);

  // Test 41: values in [0, 1)
  var rng41 = RNG.create(7);
  var range41 = true;
  for (var i = 0; i < 1000; i++) {
    var v = rng41.random();
    if (v < 0 || v >= 1) { range41 = false; break; }
  }
  assert(41, 'values in [0, 1) over 1000 samples', range41);

  // Test 42: randInt range
  var rng42 = RNG.create(13);
  var range42 = true;
  for (var i = 0; i < 200; i++) {
    var v = rng42.randInt(0, 9);
    if (v < 0 || v > 9) { range42 = false; break; }
  }
  assert(42, 'randInt(0,9) in [0,9] over 200 samples', range42);
  // Also check that we see at least a few different values
  var seen42 = {};
  var rng42b = RNG.create(13);
  for (var i = 0; i < 200; i++) seen42[rng42b.randInt(0, 9)] = true;
  assert(42, 'randInt(0,9) produces multiple distinct values', Object.keys(seen42).length >= 5,
    'saw ' + Object.keys(seen42).length + ' distinct values');

  // ===== P1.6: Two-Population Coevolution =====
  section('P1.6: Coevolution');

  // Test 46: crossTournament produces correct fitness arrays
  var coevRng = RNG.create(42);
  var coPop0 = GA.createPopulation(6, 2, coevRng);
  var coPop1 = GA.createPopulation(6, 2, coevRng);
  var coResult = GA.crossTournament(coPop0, coPop1, 10, pd);
  assertEq(46, 'crossTournament: fitness0.length = pop0.size', coResult.fitness0.length, 6);
  assertEq(46, 'crossTournament: fitness1.length = pop1.size', coResult.fitness1.length, 6);
  assert(46, 'crossTournament: all fitness >= 0',
    Array.from(coResult.fitness0).every(function(f) { return f >= 0; }) &&
    Array.from(coResult.fitness1).every(function(f) { return f >= 0; }));

  // Test 47: coevolution run produces correct stats
  var stats47 = Experiment.run({
    populationSize: 8, states: 2, rounds: 10, generations: 5, seed: 42
  });
  assertEq(47, 'coevolve run(5 gens): produces 5 stats', stats47.length, 5);
  assert(47, 'coevolve stats have required fields',
    stats47.every(function(s) {
      return typeof s.generation === 'number' &&
             typeof s.cooperationRate === 'number' &&
             typeof s.avgPayoff === 'number';
    }));

  // Test 48: coevolution is deterministic
  var stats48a = Experiment.run({
    populationSize: 8, states: 2, rounds: 10, generations: 5, seed: 7777
  });
  var stats48b = Experiment.run({
    populationSize: 8, states: 2, rounds: 10, generations: 5, seed: 7777
  });
  var match48 = true;
  for (var i = 0; i < 5; i++) {
    if (Math.abs(stats48a[i].cooperationRate - stats48b[i].cooperationRate) > 1e-10) match48 = false;
  }
  assert(48, 'coevolve: same seed -> same results (deterministic)', match48);

  // ===== Additional tests =====
  section('Additional');

  // Test 43: Pavlov (Win Stay, Lose Shift) structure
  var pavlov = Automaton.createNamed('pavlov');
  assertEq(43, 'pavlov: 2 states', pavlov.states, 2);
  assert(43, 'pavlov state0: C, transC=0, transD=1',
    pavlov.actions[0] === 0 && pavlov.transC[0] === 0 && pavlov.transD[0] === 1);
  assert(43, 'pavlov state1: D, transC=1, transD=0',
    pavlov.actions[1] === 1 && pavlov.transC[1] === 1 && pavlov.transD[1] === 0);
  assertEq(43, 'identify(pavlov) = pavlov', Automaton.identify(pavlov), 'pavlov');

  // Test 44: TF2T (Tit-for-Two-Tats)
  var tf2t = Automaton.createNamed('tf2t');
  assertEq(44, 'tf2t: 3 states', tf2t.states, 3);
  assertEq(44, 'identify(tf2t) = tf2t', Automaton.identify(tf2t), 'tf2t');
  // TF2T vs AllD: C, C, D, D, D... (cooperates twice before retaliating)
  var r44 = Game.play(tf2t, allD, 5, pd);
  assert(44, 'tf2t vs allD: cooperates first 2 rounds',
    r44.history[0].moveA === 0 && r44.history[1].moveA === 0,
    'round1=' + r44.history[0].moveA + ' round2=' + r44.history[1].moveA);
  assert(44, 'tf2t vs allD: defects from round 3',
    r44.history[2].moveA === 1 && r44.history[3].moveA === 1,
    'round3=' + r44.history[2].moveA + ' round4=' + r44.history[3].moveA);

  // Test 45: bookPD payoffs
  var bpd = Game.bookPD();
  assert(45, 'bookPD: T=5,R=4,P=1,S=0',
    bpd.T === 5 && bpd.R === 4 && bpd.P === 1 && bpd.S === 0);
  var r45 = Game.play(allC, allC, 10, bpd);
  assertEq(45, 'bookPD: AllC vs AllC = 40 each', r45.scoreA, 40);

  // ===== Render Results =====
  var container = document.getElementById('results');
  var totalPass = 0, totalFail = 0;
  var currentSec = '';

  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    if (r.section !== currentSec) {
      currentSec = r.section;
      var secEl = document.createElement('div');
      secEl.className = 'section-title';
      secEl.textContent = currentSec;
      container.appendChild(secEl);
    }
    var el = document.createElement('div');
    el.className = 'test ' + (r.pass ? 'pass' : 'fail');
    var icon = r.pass ? 'PASS' : 'FAIL';
    el.innerHTML = '<span class="num">' + r.num + '</span> ' + icon + ' ' + r.name;
    if (!r.pass && r.detail) {
      el.innerHTML += '<div class="detail">' + r.detail + '</div>';
    }
    container.appendChild(el);
    if (r.pass) totalPass++; else totalFail++;
  }

  var summaryEl = document.getElementById('summary');
  summaryEl.className = 'summary ' + (totalFail === 0 ? 'all-pass' : 'has-fail');
  summaryEl.innerHTML = '<span style="color:' + (totalFail === 0 ? 'var(--green)' : 'var(--red)') + '">' +
    totalPass + ' passed, ' + totalFail + ' failed</span> out of ' + results.length + ' assertions';

})();
</script>
